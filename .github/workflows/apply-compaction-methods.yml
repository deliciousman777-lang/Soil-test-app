name: Apply compaction method presets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-compaction-methods.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compaction method presets
        run: python .github/scripts/apply_compaction_methods.py

      - name: Check JavaScript syntax
        run: |
          node --check compaction.js
          node --check sw.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compaction.js sw.js
          git diff --cached --check
          git commit -m "Add selectable compaction test methods"
          git push
