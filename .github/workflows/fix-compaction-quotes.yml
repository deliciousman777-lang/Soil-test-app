name: Fix compaction HTML quotes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-compaction-quotes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix compaction HTML quotes
        run: python .github/scripts/fix_compaction_quotes.py
      - name: Check JavaScript syntax
        run: node --check compaction.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compaction.js
          git diff --cached --check
          git commit -m "Fix compaction method selector markup"
          git push
