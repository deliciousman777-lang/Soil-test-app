name: Deploy Soil Test App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          for f in app.js grain-delete-early.js sedimentation.js hydrometer-input.js sedimentation-cm-fix.js sedimentation-workbench.js sedimentation-workbench-focus-fix.js sedimentation-alarm.js sedimentation-auto-open.js grain-delete.js grain-charts.js fine-sieve.js dvalue-spline.js particle-density.js particle-density-common-temp.js pycnometer-master.js report-sheet.js report-ternary-fix.js atterberg-limits.js cone-index.js report-extra-tests.js sample-manager.js atterberg-np.js review-all-tests.js draft-save.js grain-wash-containers.js test-date.js numeric-input.js supabase-config.js cloud-share.js edit-lock.js project-test-plan.js input-usability.js project-completion.js; do
            node --check "$f"
          done

      - name: Prepare Pages bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          scripts = [
              'grain-delete-early.js',
              'sedimentation.js',
              'hydrometer-input.js',
              'sedimentation-cm-fix.js',
              'grain-charts.js',
              'fine-sieve.js',
              'dvalue-spline.js',
              'particle-density.js',
              'particle-density-common-temp.js',
              'pycnometer-master.js',
              'report-sheet.js',
              'report-ternary-fix.js',
              'atterberg-limits.js',
              'cone-index.js',
              'report-extra-tests.js',
              'sample-manager.js',
              'atterberg-np.js',
              'review-all-tests.js',
              'draft-save.js',
              'grain-wash-containers.js',
              'test-date.js',
              'numeric-input.js',
              'supabase-config.js',
              'cloud-share.js',
              'edit-lock.js',
              'sedimentation-workbench.js',
              'sedimentation-workbench-focus-fix.js',
              'sedimentation-alarm.js',
              'grain-delete.js',
              'sedimentation-auto-open.js',
              'project-test-plan.js',
              'input-usability.js',
              'project-completion.js',
          ]

          anchor = '  <script src="sedimentation.js"></script>'
          if anchor not in s:
              raise SystemExit('sedimentation.js anchor not found')

          chain = '\n'.join(f'  <script src="{name}"></script>' for name in scripts)
          start = s.find(anchor)
          end = start + len(anchor)
          while True:
              next_line_start = end
              if s[next_line_start:next_line_start+1] == '\n':
                  next_line_start += 1
              if not s.startswith('  <script src="', next_line_start):
                  break
              next_end = s.find('</script>', next_line_start)
              if next_end == -1:
                  break
              end = next_end + len('</script>')
          s = s[:start] + chain + s[end:]

          s = s.replace('<meta name="theme-color" content="#f4f7f6" />', '<meta name="theme-color" content="#0b5136" />')
          s = s.replace('<meta name="apple-mobile-web-app-title" content="土質試験" />', '<meta name="apple-mobile-web-app-title" content="SoilNote" />')
          s = s.replace('<title>土質試験データシート</title>', '<title>SoilNote</title>')
          if '<meta name="application-name" content="SoilNote" />' not in s:
              s = s.replace('<meta name="apple-mobile-web-app-title" content="SoilNote" />', '<meta name="apple-mobile-web-app-title" content="SoilNote" />\n  <meta name="application-name" content="SoilNote" />')
          if '<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />' not in s:
              s = s.replace('<link rel="manifest" href="manifest.webmanifest" />', '<link rel="manifest" href="manifest.webmanifest" />\n  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />')
          s = s.replace('<p class="eyebrow">SOIL TEST</p>', '<p class="eyebrow">土質試験を、もっとスマートに。</p>')
          s = s.replace('<h1>土質試験データシート</h1>', '<h1>SoilNote</h1>')
          p.write_text(s, encoding='utf-8')
          PY

          base64 -d icons/apple-touch-icon.b64 > icons/apple-touch-icon.png
          rm -f icons/apple-touch-icon.b64 icons/.keep icons/test.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('icons/apple-touch-icon.png')
          assert p.exists() and p.stat().st_size > 10000, 'icon decode failed'
          assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'grain-delete-early.js' in html, 'Early grain delete script missing'
          assert 'supabase-config.js' in html, 'Supabase config script missing'
          assert 'cloud-share.js' in html, 'Cloud share script missing'
          assert 'edit-lock.js' in html, 'Edit lock script missing'
          assert 'sedimentation-workbench.js' in html, 'Sedimentation workbench script missing'
          assert 'sedimentation-workbench-focus-fix.js' in html, 'Sedimentation workbench focus fix missing'
          assert 'sedimentation-alarm.js' in html, 'Sedimentation alarm script missing'
          assert 'grain-delete.js' in html, 'Grain delete script missing'
          assert 'sedimentation-auto-open.js' in html, 'Sedimentation auto-open script missing'
          assert 'project-test-plan.js' in html, 'Project test plan script missing'
          assert 'input-usability.js' in html, 'Input usability script missing'
          assert 'particle-density-common-temp.js' in html, 'Particle density common temperature script missing'
          assert 'project-completion.js' in html, 'Project completion script missing'
          assert 'cloud-sync.js' not in html, 'Old cloud sync script must not be published'
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
