name: Deploy Soil Test App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sedimentation.js
          node --check hydrometer-input.js
          node --check sedimentation-cm-fix.js
          node --check grain-charts.js
          node --check fine-sieve.js
          node --check dvalue-spline.js
      - name: Prepare Pages bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          sed = '  <script src="sedimentation.js"></script>'
          hydro = '  <script src="hydrometer-input.js"></script>'
          sedfix = '  <script src="sedimentation-cm-fix.js"></script>'
          grain = '  <script src="grain-charts.js"></script>'
          fine = '  <script src="fine-sieve.js"></script>'
          spline = '  <script src="dvalue-spline.js"></script>'
          if hydro not in s:
              s = s.replace(sed, sed + '\n' + hydro)
          if sedfix not in s:
              s = s.replace(hydro, hydro + '\n' + sedfix)
          if grain not in s:
              s = s.replace(sedfix, sedfix + '\n' + grain)
          if fine not in s:
              s = s.replace(grain, grain + '\n' + fine)
          if spline not in s:
              s = s.replace(fine, fine + '\n' + spline)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
